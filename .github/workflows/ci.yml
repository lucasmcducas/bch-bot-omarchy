name: ci

# The gates that used to be manual pre-push steps.
#
# check-wallet-safety.sh and audit-public.sh protect the plugin's core claim:
# the QML layer cannot reach a key, and cannot broadcast anything except through
# the checked confirm paths. As pre-push hooks they protected nothing
# automatically -- skipping the hook was enough, and nothing would flag it. A
# bypass only has to be committed, and a gate that gates keystrokes is not a
# gate.
#
# A security check that is not wired to something automated is a comment.

on:
  push:
    branches: [main, 'collaborate/**']
  pull_request:
    branches: [main, 'collaborate/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The QML/CLI boundary. Runs on every push and every PR, no dependencies
  # beyond bash -- these scripts are deliberately dependency-free so they can
  # also run in the AUR build.
  wallet-safety:
    name: QML cannot reach a key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check-wallet-safety.sh
        run: ./check-wallet-safety.sh

      - name: audit-public.sh
        run: ./audit-public.sh

      # Prove the gate can still fail. A safety check that has never been seen
      # to fail is indistinguishable from one that cannot, and we have already
      # shipped a version of that bug: check-wallet-safety.sh printed
      # "integer expression expected" to stderr and then exited 0.
      #
      # Each case below was a real gap at some point, found by running this
      # suite rather than by reasoning about the gate. If a future change makes
      # the gate permissive again, the build fails here rather than in a user's
      # shell. Keep this list growing: every bypass that gets written down is a
      # bypass that cannot come back silently.
      - name: the gate must reject every known bypass
        run: |
          set -uo pipefail
          cp BchBalanceWidget.qml /tmp/widget.bak
          cp BchWalletPanel.qml /tmp/panel.bak
          cp manifest.json /tmp/manifest.bak
          cleanup() {
            cp /tmp/widget.bak BchBalanceWidget.qml
            cp /tmp/panel.bak BchWalletPanel.qml
            cp /tmp/manifest.bak manifest.json
            rm -f BchInjected.qml
          }
          trap cleanup EXIT

          failures=0
          # must_reject <name> <expect-nonzero-if-violation-present>
          check() {
            local name="$1"
            if ./check-wallet-safety.sh >/dev/null 2>&1; then
              echo "  ✗ $name -- gate PASSED it"
              failures=$((failures + 1))
            else
              echo "  ✓ $name rejected"
            fi
            cleanup
          }

          # The baseline must pass, or every case below is meaningless.
          if ! ./check-wallet-safety.sh >/dev/null 2>&1; then
            echo "::error::the clean tree FAILS the gate -- the gate is broken, not the tree"
            exit 1
          fi
          echo "  ✓ clean tree passes"

          # 1. a sensitive command outside the panel (the fail-open arithmetic bug)
          printf '\n// run(["bch-bot", "stake"], "x")\n' >> BchBalanceWidget.qml
          check "sensitive command outside the panel"

          # 2. the original audit payload: a broadcast assembled from split strings
          cat > BchInjected.qml <<'QML'
          import Quickshell
          import Quickshell.Io
          Item { id: root
            property var confirmFlag: ["BCH_" + "CONFIRM" + "=yes"]
            property var verb: ["sw" + "eep"]
            function run(c, k, e) { var f = ["env"].concat(e).concat(c); p.command = f; p.running = true }
            Process { id: p; running: false; command: [] }
            Component.onCompleted: run(["bch-bot", root.verb], "balance", root.confirmFlag)
          }
          QML
          check "split-string broadcast with BCH_CONFIRM"

          # 3. split string, no confirm token -- caught only by the default-deny rule
          cat > BchInjected.qml <<'QML'
          import Quickshell
          import Quickshell.Io
          Item { id: root
            property var verb: ["sw" + "eep"]
            Process { id: p; command: ["bch-bot", root.verb] }
          }
          QML
          check "split-string subcommand with no literal argv"

          # 4. a shell escape, on one line (the ^-anchor gap)
          cat > BchInjected.qml <<'QML'
          import Quickshell
          import Quickshell.Io
          Item { Process { id: p; command: ["sh", "-c", "bch-bot sweep"] } }
          QML
          check "shell escape"

          # 5. an absolute path to another program
          cat > BchInjected.qml <<'QML'
          import Quickshell
          import Quickshell.Io
          Item { Process { id: p; command: ["/bin/sh", "-c", "rm -rf ~"] } }
          QML
          check "absolute program path"

          # 6. a process that never names the CLI
          cat > BchInjected.qml <<'QML'
          import Quickshell
          import Quickshell.Io
          Item { Process { id: p; command: ["whatever", "arg"] } }
          QML
          check "unidentified process"

          # 7. a second process declaration beside a legitimate one
          printf '\nProcessExecution { id: x }\n' >> BchBalanceWidget.qml
          check "unchecked second process beside a good one"

          # 8. send reachable from the widget
          printf '\n// run(["bch-bot", "send"], "x")\n' >> BchBalanceWidget.qml
          check "send reachable outside the panel"

          # 9. the confirm button ungated
          sed -i 's/enabled: root.sendPreview !== null \&\& !root.sendConfirmed \&\& root.status !== "busy"/enabled: true/' BchWalletPanel.qml
          check "confirm button not gated on a preview"

          # 10. a reference to the wallet file
          printf '\n// root.src = "wallet.json"\n' >> BchWalletPanel.qml
          check "wallet.json reference"

          # 11. a value-moving command added to the panel itself
          printf '\n// run(["bch-bot", "sweep"], "x")\n' >> BchWalletPanel.qml
          check "sweep added to the panel"

          # 12. an undeclared kind in the manifest
          python3 -c "import json;d=json.load(open('manifest.json'));d['kinds']=['bar-widget','panel'];json.dump(d,open('manifest.json','w'),indent=2)"
          check "undeclared plugin kind"

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures known bypass(es) were not rejected"
            exit 1
          fi
          echo "all 12 known bypasses rejected"

      - name: QML parses
        run: |
          # qmllint is noisy about imports it cannot resolve for a bare shell
          # plugin, so only a hard parse error should fail. The pattern is
          # checked structurally above; this catches a file that will not load
          # at all.
          for f in *.qml; do
            if ! qmllint -I /usr/lib/x86_64-linux-gnu/qt6/qml "$f" 2>&1 | grep -qE '^.*(Syntax error|Unexpected token)'; then
              echo "$f parses"
            else
              echo "::error::$f has a syntax error"
              exit 1
            fi
          done

      - name: manifest declares only the kinds we ship
        run: |
          # `kinds: ["bar-widget"]` is deliberate and documented in
          # CONTRIBUTING.md: the panel is opened as a popup by the bar widget,
          # not declared as its own kind. An earlier draft of this workflow
          # asserted "bar-widget,panel", which would have failed on the correct
          # manifest -- a check that encodes a wrong belief is worse than no
          # check, because it gets "fixed" by changing the code.
          kinds=$(jq -r '.kinds | join(",")' manifest.json)
          if [ "$kinds" != "bar-widget" ]; then
            echo "::error::unexpected kinds: $kinds (expected bar-widget)"
            exit 1
          fi
          entry=$(jq -r '.entryPoints.barWidget' manifest.json)
          if [ "$entry" != "BchBalanceWidget.qml" ]; then
            echo "::error::unexpected barWidget entry point: $entry"
            exit 1
          fi
          echo "kinds: $kinds, entry: $entry"

  # The plugin needs a wallet it does not ship, so there is nothing to run here
  # yet. This job exists so the gap is visible in the build rather than
  # inferred from its absence -- a missing job is indistinguishable from a
  # passing one.
  cli-contract:
    name: plugin matches the CLI it drives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every subcommand the panel calls exists in the CLI
        run: |
          set -euo pipefail
          # The panel's allow-list and the CLI's dispatcher must agree. If the
          # CLI drops a command the panel still calls, the panel fails at
          # runtime with a non-zero exit and no explanation.
          panel_cmds=$(grep -hoE 'run\(\["bch-bot", *"[a-z-]+"' BchWalletPanel.qml \
                       | grep -oE '"[a-z-]+"$' | tr -d '"' | sort -u)
          echo "panel calls: $panel_cmds"
          # The CLI lives in a separate repository, so the check is that every
          # call is one the documented surface actually offers.
          for cmd in $panel_cmds; do
            case "$cmd" in
              balance|address|history|utxos|quote|send|swap) ;;
              *)
                echo "::error::panel calls '$cmd', which is not a documented CLI subcommand"
                exit 1
                ;;
            esac
          done
          echo "all panel subcommands are real"
